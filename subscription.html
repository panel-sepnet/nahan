<style>
*{

}

html,
body{

.bg{
    position:fixed;
    inset:0;
    z-index:-10;
    background:
        radial-gradient(
            ellipse 800px 600px at 15% 10%,
            rgba(255,210,31,.12),
            transparent 70%
        ),
        radial-gradient(
            ellipse 700px 500px at 90% 20%,
            rgba(255,184,0,.08),
            transparent 65%
        ),
        radial-gradient(
            ellipse 600px 500px at 50% 100%,
            rgba(255,210,31,.05),
            transparent 70%

}

.grid-bg{
    position:fixed;
    inset:0;
    z-index:-9;
    opacity:.25;
    background-image:
        linear-gradient(
            rgba(255,210,31,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,210,31,.035) 1px,
            transparent 1px
        );

        ellipse 90% 80% at center,

@keyframes gridMove{

        background-position:0 0;
    }

    }
}

.orb{

@keyframes floatOrb{

    }

@keyframes musicPulse{

#toast{

@media(max-width:768px){

    }

        display:none;
    }

}
</style>

<script>

/* =====================================================
   LANGUAGE
===================================================== */

function toggleLanguage(){

    const html = document.documentElement;

    if(html.lang === "fa"){
        html.lang = "en";
        html.dir = "ltr";
    }else{
        html.lang = "fa";
        html.dir = "rtl";
    }

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

    document.documentElement.classList.toggle("dark");

}


/* =====================================================
   MOUSE GLOW
===================================================== */

const mouseGlow = document.getElementById("mouseGlow");

if(window.matchMedia("(pointer:fine)").matches){

    document.addEventListener("mousemove",function(e){

        mouseGlow.style.left = e.clientX + "px";
        mouseGlow.style.top = e.clientY + "px";
        mouseGlow.classList.add("active");

    });

    document.addEventListener("mouseleave",function(){

        mouseGlow.classList.remove("active");

    });

}


/* =====================================================
   MUSIC
===================================================== */

let audioCtx = null;
let masterGain = null;
let musicTimer = null;
let musicPlaying = false;

const notes = [
    220,
    261.63,
    329.63,
    392,
    329.63,
    293.66
];

let noteIndex = 0;

function startMusic(){

    if(musicPlaying)
        return;

    try{

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        masterGain =
            audioCtx.createGain();

        masterGain.gain.value = .035;

        masterGain.connect(
            audioCtx.destination
        );

        musicPlaying = true;

        document
            .getElementById("musicBtn")
            .classList.add("playing");

        document
            .getElementById("musicIcon")
            .textContent = "music_note";

        playNote();

    }catch(e){

        console.log("Audio error:",e);

    }

}

function playNote(){

    if(!musicPlaying || !audioCtx)
        return;

    const now =
        audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.value =
        notes[noteIndex];

    gain.gain.setValueAtTime(
        .001,
        now
    );

    gain.gain.linearRampToValueAtTime(
        .18,
        now + .8
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + 3.8
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 4);

    noteIndex++;

    if(noteIndex >= notes.length)
        noteIndex = 0;

    musicTimer =
        setTimeout(playNote,2500);

}

function stopMusic(){

    musicPlaying = false;

    clearTimeout(musicTimer);

    if(masterGain && audioCtx){

        try{

            masterGain.gain.exponentialRampToValueAtTime(
                .001,
                audioCtx.currentTime + .5
            );

        }catch(e){}

    }

    document
        .getElementById("musicBtn")
        .classList.remove("playing");

    document
        .getElementById("musicIcon")
        .textContent = "music_off";

}

function toggleMusic(){

    if(musicPlaying)
        stopMusic();
    else
        startMusic();

}


/* =====================================================
   API / SUBSCRIPTION
===================================================== */

(function(){

    /*
     * مهم:
     *
     * این صفحه می‌تواند با این فرمت‌ها باز شود:
     *
     * /sub/tel:@sepnet_conf
     * /sub/@sepnet_conf
     * /sub/sepnet_conf
     *
     * و همه آنها را به username مناسب تبدیل می‌کند.
     */

    function getUsername(){

        let parts =
            window.location.pathname
                .split("/")
                .filter(Boolean);

        let value =
            parts.length
            ? parts[parts.length - 1]
            : "";

        value =
            decodeURIComponent(value);

        /*
         * حذف tel:
         */

        if(
            value.toLowerCase().startsWith("tel:")
        ){

            value =
                value.substring(4);

        }

        /*
         * حذف @ اضافی برای API
         * در صورت نیاز API می‌تواند username
         * بدون @ را دریافت کند.
         */

        let apiUsername =
            value.replace(/^@+/,"");

        return {
            original:value,
            api:apiUsername
        };

    }


    const user =
        getUsername();

    /*
     * API اصلی
     */

    const apiUrl =
        "/api/sub/" +
        encodeURIComponent(user.api);


    let subUrl = "";

    const state = {
        data:null
    };


    /* =================================================
       HELPERS
    ================================================= */

    function esc(s){

        return String(
            s == null ? "" : s
        ).replace(
            /[&<>"']/g,
            function(c){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#39;"
                }[c];

            }
        );

    }


    function fmtBytes(bytes){

        if(
            bytes === null ||
            bytes === undefined ||
            isNaN(bytes)
        )
            return "0 B";

        bytes =
            Number(bytes);

        if(bytes <= 0)
            return "0 B";

        const units = [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

        let i = 0;

        while(
            bytes >= 1024 &&
            i < units.length - 1
        ){

            bytes /= 1024;
            i++;

        }

        return (
            bytes.toFixed(i ? 2 : 0)
            + " "
            + units[i]
        );

    }


    function toast(message){

        const t =
            document.getElementById("toast");

        t.textContent =
            message;

        t.classList.add("show");

        setTimeout(function(){

            t.classList.remove("show");

        },2200);

    }


    function copyText(text){

        if(!text)
            return;

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            navigator.clipboard
                .writeText(text)
                .then(function(){

                    toast("کپی شد ✓");

                })
                .catch(function(){

                    fallbackCopy(text);

                });

        }else{

            fallbackCopy(text);

        }

    }


    function fallbackCopy(text){

        const textarea =
            document.createElement("textarea");

        textarea.value =
            text;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";

        document.body.appendChild(
            textarea
        );

        textarea.focus();
        textarea.select();

        try{

            document.execCommand("copy");

            toast("کپی شد ✓");

        }catch(e){

            toast("خطا در کپی");

        }

        document.body.removeChild(
            textarea
        );

    }


    /* =================================================
       RING
    ================================================= */

    function ring(days,maxDays){

        const r = 54;

        const circumference =
            2 * Math.PI * r;

        let percentage = 1;

        if(
            days !== null &&
            days !== undefined &&
            maxDays > 0
        ){

            percentage =
                Math.max(
                    0,
                    Math.min(
                        1,
                        Number(days) / Number(maxDays)
                    )
                );

        }

        const offset =
            circumference *
            (1 - percentage);

        const number =
            days === null ||
            days === undefined
            ? "∞"
            : esc(days);

        return `

        <div class="relative w-48 h-48 mx-auto flex items-center justify-center">

            <svg
                class="w-full h-full"
                viewBox="0 0 120 120">

                <circle
                    cx="60"
                    cy="60"
                    r="54"
                    fill="none"
                    stroke="rgba(255,255,255,.06)"
                    stroke-width="8">
                </circle>

                <circle
                    class="progress-ring"
                    cx="60"
                    cy="60"
                    r="54"
                    fill="none"
                    stroke="#ffd21f"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${offset}"
                    style="
                        filter:drop-shadow(
                            0 0 5px
                            rgba(255,210,31,.5)
                        );
                    ">
                </circle>

            </svg>

            <div class="absolute flex flex-col items-center">

                <span class="text-4xl font-extrabold gold-glow">
                    ${number}
                </span>

                <span class="text-[10px] text-zinc-500 uppercase tracking-[.25em]">
                    DAYS
                </span>

            </div>

        </div>

        `;

    }


    /* =================================================
       CONFIG
    ================================================= */

    function cfgBlock(config,index,data){

        let address = "";
        let port = "";
        let path = "";
        let sni = "";
        let type = "";

        try{

            const url =
                new URL(config);

            address =
                url.hostname;

            port =
                url.port;

            path =
                url.pathname;

            const params =
                new URLSearchParams(
                    url.search
                );

            sni =
                params.get("sni") || "";

            type =
                params.get("type") ||
                data.protocol ||
                "vless";

        }catch(e){

            type =
                data.protocol ||
                "vless";

        }


        let display = "";

        if(address){

            display =
                address;

            if(port)
                display += ":" + port;

        }

        if(
            path &&
            path !== "/"
        ){

            display +=
                " " + path;

        }

        if(sni){

            display +=
                " | SNI: " + sni;

        }

        if(!display){

            display =
                String(config)
                    .substring(0,100);

        }


        let protocol =
            String(
                config
                    .split("://")[0] ||
                data.protocol ||
                "vless"
            ).toUpperCase();


        return `

        <div
            class="cfg group"
            onclick="copyCfgIndex(${index})">

            <div class="flex items-center justify-between gap-4">

                <div class="min-w-0">

                    <div class="flex flex-wrap items-center gap-2 mb-2">

                        <span
                            class="font-mono text-xs font-bold gold"
                            dir="ltr">

                            ${esc(protocol)} #${index + 1}

                        </span>

                        <span class="
                            px-2 py-1
                            rounded-full
                            bg-[#ffd21f]/5
                            border
                            border-[#ffd21f]/10
                            text-[9px]
                            text-zinc-500">

                            ${esc(String(type).toUpperCase())}

                        </span>

                    </div>

                    <div
                        class="cfg-text truncate max-w-[250px] md:max-w-[600px]"
                        dir="ltr"
                        title="${esc(config)}">

                        ${esc(display)}

                    </div>

                </div>

                <button
                    onclick="event.stopPropagation();copyCfgIndex(${index})"
                    class="
                        w-9 h-9
                        shrink-0
                        rounded-xl
                        bg-white/5
                        hover:bg-[#ffd21f]/10
                        hover:text-[#ffd21f]
                        flex
                        items-center
                        justify-center
                        text-zinc-500
                        transition">

                    <span class="material-symbols-outlined text-[17px]">
                        content_copy
                    </span>

                </button>

            </div>

        </div>

        `;

    }


    /* =================================================
       SECTION
    ================================================= */

    function cfgSection(label,count){

        return `

        <div class="flex items-center gap-2 px-3 py-2 my-1">

            <span class="material-symbols-outlined gold text-[16px]">
                bolt
            </span>

            <span class="text-[10px] text-zinc-500 font-bold">

                ${esc(label)}

                ${
                    count
                    ? " — " + count
                    : ""
                }

            </span>

        </div>

        `;

    }


    /* =================================================
       STATUS
    ================================================= */

    function buildStatusBlock(){

        const d =
            state.data || {};

        const days =
            d.expire_days == null
            ? "∞"
            : d.expire_days;

        const used =
            Number(
                d.traffic_used_bytes || 0
            );

        const limit =
            Number(
                d.traffic_limit_bytes || 0
            );

        let percent = 0;

        if(
            d.traffic_percent != null
        ){

            percent =
                Number(
                    d.traffic_percent
                );

        }else if(limit > 0){

            percent =
                Math.min(
                    100,
                    used / limit * 100
                );

        }

        return `

        <div
            class="cfg"
            onclick="copyStatus()">

            <div class="flex items-center gap-3">

                <div class="
                    w-9 h-9
                    rounded-xl
                    bg-[#ffd21f]/10
                    flex
                    items-center
                    justify-center">

                    <span class="material-symbols-outlined gold text-[19px]">
                        schedule
                    </span>

                </div>

                <div class="flex-1">

                    <div class="text-xs font-bold">
                        وضعیت اشتراک
                    </div>

                    <div class="flex flex-wrap gap-2 mt-2">

                        <span class="
                            px-2 py-1
                            rounded-full
                            bg-white/5
                            text-[9px]
                            text-zinc-500">

                            ${esc(days)} روز

                        </span>

                        <span class="
                            px-2 py-1
                            rounded-full
                            bg-white/5
                            text-[9px]
                            text-zinc-500">

                            ${fmtBytes(used)}
                            /
                            ${limit > 0 ? fmtBytes(limit) : "∞"}

                        </span>

                        <span class="
                            px-2 py-1
                            rounded-full
                            bg-[#ffd21f]/10
                            text-[#ffd21f]
                            text-[9px]">

                            ${percent.toFixed(1)}%

                        </span>

                    </div>

                </div>

            </div>

        </div>

        `;

    }


    /* =================================================
       RENDER
    ================================================= */

    function render(data){

        const d =
            data || {};

        const used =
            Number(
                d.traffic_used_bytes || 0
            );

        const limit =
            Number(
                d.traffic_limit_bytes || 0
            );

        let percent = 0;

        if(
            d.traffic_percent != null
        ){

            percent =
                Number(
                    d.traffic_percent
                );

        }else if(limit > 0){

            percent =
                Math.min(
                    100,
                    used / limit * 100
                );

        }


        const days =
            d.expire_days == null
            ? null
            : Number(d.expire_days);


        const active =
            d.is_active !== false &&
            (
                !d.status ||
                String(d.status).toLowerCase()
                === "active"
            );


        /*
         * CONFIGS
         */

        let configs = [];


        if(
            Array.isArray(d.configs)
        ){

            configs =
                d.configs.filter(function(c){

                    return (
                        c &&
                        typeof c === "string" &&
                        !c.includes("%F0%9F%93%8A")
                    );

                });

        }


        if(
            Array.isArray(d.worker_configs) &&
            d.worker_configs.length
        ){

            configs =
                d.worker_configs.filter(Boolean);

        }


        if(
            !configs.length &&
            d.config
        ){

            configs = [
                d.config
            ];

        }


        if(
            !configs.length &&
            d.vless_link
        ){

            configs = [
                d.vless_link
            ];

        }


        window.__cfgs =
            configs;

        window.__cfg =
            configs[0] || "";


        /*
         * STATUS CONFIG
         */

        let statusConfig = "";

        if(configs[0]){

            const statusText =
                String(
                    d.username ||
                    user.original ||
                    user.api
                ) +
                " STATUS | " +
                (
                    days == null
                    ? "∞"
                    : days
                ) +
                "d | " +
                Math.round(percent) +
                "%";


            statusConfig =
                configs[0]
                    .replace(
                        /#[^#]*$/,
                        ""
                    ) +
                "#" +
                encodeURIComponent(
                    statusText
                );

        }


        window.__statuscfg =
            statusConfig;


        /*
         * SUB URL
         *
         * اگر API لینک ساب اختصاصی داد
         * همان استفاده می‌شود.
         */

        if(d.subscription_url){

            subUrl =
                d.subscription_url;

        }else if(d.sub_url){

            subUrl =
                d.sub_url;

        }else if(d.config_uuid){

            subUrl =
                window.location.origin +
                "/sub/" +
                encodeURIComponent(
                    d.config_uuid
                );

        }else{

            /*
             * fallback
             */

            subUrl =
                window.location.origin +
                "/sub/" +
                encodeURIComponent(
                    user.original
                );

        }


        /*
         * LEFT
         */

        const left = `

        <div class="flex flex-col gap-5">

            <div class="
                glass
                rounded-3xl
                p-7 md:p-9
                text-center
                rise rise1
                relative
                overflow-hidden">

                <div
                    class="absolute inset-0 pointer-events-none"
                    style="
                        background:
                        radial-gradient(
                            circle at center,
                            rgba(255,210,31,.08),
                            transparent 60%
                        );
                    ">
                </div>

                <div class="relative">

                    <div class="flex justify-center mb-2">

                        <span class="
                            text-[10px]
                            tracking-[.25em]
                            text-zinc-600
                            uppercase">

                            SEP NET

                        </span>

                    </div>

                    <h2 class="text-xl font-bold mb-6">
                        زمان <span class="gold">باقیمانده</span>
                    </h2>

                    ${ring(days,30)}

                    <div class="
                        mt-5
                        flex
                        justify-center
                        items-center
                        gap-2">

                        <div class="
                            status-dot
                            ${active ? "" : "offline"}">
                        </div>

                        <span class="text-xs text-zinc-500">

                            ${
                                active
                                ? "اشتراک فعال"
                                : "اشتراک غیرفعال"
                            }

                        </span>

                    </div>

                </div>

            </div>


            <div class="
                glass
                rounded-3xl
                p-6
                rise rise2">

                <div class="
                    flex
                    justify-between
                    items-end
                    mb-3">

                    <span class="text-xs text-zinc-500">
                        ترافیک مصرفی
                    </span>

                    <div dir="ltr">

                        <span class="text-lg font-bold">
                            ${fmtBytes(used)}
                        </span>

                        <span class="text-xs text-zinc-600">
                            /
                            ${limit > 0 ? fmtBytes(limit) : "∞"}
                        </span>

                    </div>

                </div>


                <div class="
                    h-2
                    rounded-full
                    bg-white/5
                    overflow-hidden">

                    <div
                        class="h-full rounded-full"
                        style="
                            width:${Math.min(100,Math.max(0,percent)).toFixed(1)}%;
                            background:
                            linear-gradient(
                                90deg,
                                #ffb800,
                                #ffd21f,
                                #fff06a
                            );
                            box-shadow:
                            0 0 10px
                            rgba(255,210,31,.35);
                        ">
                    </div>

                </div>


                <div class="
                    flex
                    justify-between
                    mt-5
                    pt-5
                    border-t
                    border-white/5">

                    <span class="text-xs text-zinc-500">
                        پروتکل
                    </span>

                    <span
                        class="font-mono text-xs gold"
                        dir="ltr">

                        ${esc(
                            String(
                                d.protocol ||
                                "VLESS"
                            ).toUpperCase()
                        )}

                    </span>

                </div>


                <div class="
                    flex
                    justify-between
                    mt-5
                    pt-5
                    border-t
                    border-white/5">

                    <span class="text-xs text-zinc-500">
                        تعداد دستگاه
                    </span>

                    <span
                        class="font-mono text-xs"
                        dir="ltr">

                        ${
                            d.used_ips != null
                            ? esc(d.used_ips) +
                              " / " +
                              (
                                  d.max_ip_per_user != null
                                  ? esc(d.max_ip_per_user)
                                  : "∞"
                              )
                            : "∞"
                        }

                    </span>

                </div>

            </div>

        </div>

        `;


        /*
         * RIGHT CONFIGS
         */

        let configHTML = "";

        configHTML +=
            buildStatusBlock();


        configs.forEach(function(config,index){

            configHTML +=
                cfgBlock(
                    config,
                    index,
                    d
                );

        });


        /*
         * CUSTOM SECTIONS
         *
         * فقط در صورت وجود واقعی
         */

        if(
            Array.isArray(d.custom_railway_configs) &&
            d.custom_railway_configs.length
        ){

            configHTML +=
                cfgSection(
                    "Railway IPs",
                    d.custom_railway_configs.length
                );

        }


        if(
            Array.isArray(d.custom_cf_configs) &&
            d.custom_cf_configs.length
        ){

            configHTML +=
                cfgSection(
                    "Cloudflare IPs",
                    d.custom_cf_configs.length
                );

        }


        if(
            Array.isArray(d.sni_spoof_configs) &&
            d.sni_spoof_configs.length
        ){

            configHTML +=
                cfgSection(
                    "SNI Spoof for v2box",
                    d.sni_spoof_configs.length
                );

        }


        /*
         * RIGHT
         */

        const right = `

        <div class="
            glass
            rounded-3xl
            p-6 md:p-8
            h-full
            rise rise3">

            <div class="
                flex
                flex-col
                sm:flex-row
                sm:items-center
                justify-between
                gap-4
                mb-6">

                <div>

                    <div class="
                        text-[10px]
                        text-zinc-600
                        tracking-[.2em]
                        uppercase
                        mb-1">

                        Connection

                    </div>

                    <h2 class="text-xl font-bold">

                        کانفیگ‌های
                        <span class="gold">
                            اشتراک
                        </span>

                    </h2>

                </div>


                <div class="flex gap-2">

                    ${
                        configs.length
                        ? `

                        <button
                            onclick="showQr()"
                            class="
                                flex
                                items-center
                                gap-2
                                px-4
                                py-2.5
                                rounded-xl
                                border
                                border-white/10
                                hover:border-[#ffd21f]/30
                                hover:text-[#ffd21f]
                                text-xs
                                text-zinc-400
                                transition">

                            <span class="material-symbols-outlined text-[17px]">
                                qr_code_2
                            </span>

                            QR

                        </button>

                        `
                        : ""
                    }


                    ${
                        configs.length
                        ? `

                        <button
                            onclick="copyCfg()"
                            class="
                                flex
                                items-center
                                gap-2
                                px-4
                                py-2.5
                                rounded-xl
                                gold-button
                                text-xs">

                            <span class="material-symbols-outlined text-[17px]">
                                content_copy
                            </span>

                            کپی همه

                        </button>

                        `
                        : ""
                    }

                </div>

            </div>


            <div class="
                flex
                flex-col
                gap-3
                max-h-[650px]
                overflow-y-auto
                pr-1">

                ${configHTML}

            </div>


            ${
                configs.length
                ? `

                <div class="
                    flex
                    flex-wrap
                    gap-2
                    mt-5
                    pt-5
                    border-t
                    border-white/5">

                    <button
                        onclick="copySub()"
                        class="
                            flex-1
                            min-w-[160px]
                            flex
                            items-center
                            justify-center
                            gap-2
                            px-4
                            py-3
                            rounded-xl
                            border
                            border-white/10
                            hover:border-[#ffd21f]/30
                            hover:text-[#ffd21f]
                            text-xs
                            text-zinc-400
                            transition">

                        <span class="material-symbols-outlined text-[17px]">
                            link
                        </span>

                        کپی لینک ساب

                    </button>


                    <button
                        onclick="importSub()"
                        class="
                            flex-1
                            min-w-[160px]
                            flex
                            items-center
                            justify-center
                            gap-2
                            px-4
                            py-3
                            rounded-xl
                            gold-button
                            text-xs">

                        <span class="material-symbols-outlined text-[17px]">
                            download
                        </span>

                        وارد کردن اشتراک

                    </button>

                </div>

                `
                : ""
            }

        </div>

        `;


        document.getElementById(
            "app"
        ).innerHTML = `

        <div class="
            grid
            grid-cols-1
            md:grid-cols-12
            gap-5">

            <div class="md:col-span-4">
                ${left}
            </div>

            <div class="md:col-span-8">
                ${right}
            </div>

        </div>

        `;

    }


    /* =================================================
       ERROR
    ================================================= */

    function renderError(message){

        document.getElementById(
            "app"
        ).innerHTML = `

        <div class="
            glass
            rounded-3xl
            p-10 md:p-12
            text-center">

            <div class="
                w-16
                h-16
                rounded-2xl
                mx-auto
                bg-red-500/5
                flex
                items-center
                justify-center">

                <span class="
                    material-symbols-outlined
                    text-red-400
                    text-[35px]">

                    error

                </span>

            </div>


            <h2 class="mt-5 text-xl font-bold">
                اشتراک پیدا نشد
            </h2>


            <p class="
                mt-2
                text-sm
                text-zinc-600">

                ${esc(message)}

            </p>


            <div class="
                mt-6
                text-[10px]
                text-zinc-700
                font-mono
                break-all"
                dir="ltr">

                ${esc(apiUrl)}

            </div>


            <button
                onclick="location.reload()"
                class="
                    mt-6
                    px-5
                    py-2.5
                    rounded-xl
                    gold-button
                    text-xs">

                تلاش مجدد

            </button>

        </div>

        `;

    }


    /* =================================================
       LOAD
    ================================================= */

    async function load(){

        try{

            /*
             * username خالی
             */

            if(!user.api){

                throw new Error(
                    "Username is empty"
                );

            }


            console.log(
                "Subscription username:",
                user.api
            );

            console.log(
                "API:",
                apiUrl
            );


            const response =
                await fetch(
                    apiUrl,
                    {
                        method:"GET",
                        headers:{
                            "Accept":
                                "application/json"
                        },
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                if(response.status === 404){

                    throw new Error(
                        "User not found"
                    );

                }

                if(response.status === 403){

                    throw new Error(
                        "Access denied"
                    );

                }

                throw new Error(
                    "Server error (" +
                    response.status +
                    ")"
                );

            }


            const contentType =
                response.headers
                    .get("content-type") ||
                "";


            if(
                !contentType.includes(
                    "application/json"
                )
            ){

                throw new Error(
                    "API did not return JSON"
                );

            }


            const data =
                await response.json();


            if(
                !data ||
                typeof data !== "object"
            ){

                throw new Error(
                    "Invalid API response"
                );

            }


            state.data =
                data;


            document.title =
                "SEP NET | " +
                (
                    data.username ||
                    user.original ||
                    user.api
                );


            render(data);


        }catch(error){

            console.error(
                "Subscription error:",
                error
            );

            renderError(
                error.message ||
                "Unknown error"
            );

        }

    }


    /* =================================================
       GLOBAL ACTIONS
    ================================================= */

    window.copyCfg =
        function(){

            const list = [];

            if(window.__statuscfg){

                list.push(
                    window.__statuscfg
                );

            }

            (
                window.__cfgs || []
            ).forEach(function(config){

                if(config)
                    list.push(config);

            });


            copyText(
                list.join("\n")
            );

        };


    window.copyCfgIndex =
        function(index){

            const config =
                (
                    window.__cfgs || []
                )[index];

            if(config)
                copyText(config);

        };


    window.copyStatus =
        function(){

            if(window.__statuscfg)
                copyText(
                    window.__statuscfg
                );

        };


    window.copySub =
        function(){

            if(subUrl){

                copyText(
                    subUrl
                );

            }else{

                toast(
                    "لینک اشتراک موجود نیست"
                );

            }

        };


    window.importSub =
        function(){

            if(!subUrl){

                toast(
                    "لینک اشتراک موجود نیست"
                );

                return;

            }


            const v2rayUrl =
                "v2rayng://install-sub?url=" +
                encodeURIComponent(
                    subUrl
                );


            window.location.href =
                v2rayUrl;

        };


    window.showQr =
        function(){

            const modal =
                document.getElementById(
                    "qrModal"
                );

            const img =
                document.getElementById(
                    "qrImg"
                );


            if(!modal || !img)
                return;


            /*
             * اگر API مخصوص QR دارد
             */

            img.src =
                "/api/sub/" +
                encodeURIComponent(
                    user.api
                ) +
                "/qr?t=" +
                Date.now();


            img.onerror =
                function(){

                    /*
                     * fallback به QR عمومی
                     */

                    img.onerror = null;

                    img.src =
                        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
                        encodeURIComponent(
                            subUrl ||
                            window.__cfg ||
                            ""
                        );

                };


            modal.classList.add(
                "show"
            );

        };


    window.closeQr =
        function(){

            const modal =
                document.getElementById(
                    "qrModal"
                );

            if(modal){

                modal.classList.remove(
                    "show"
                );

            }

        };


    /*
     * بستن QR با کلیک بیرون
     */

    document
        .getElementById("qrModal")
        .addEventListener(
            "click",
            function(e){

                if(
                    e.target === this
                ){

                    closeQr();

                }

            }
        );


    /*
     * ESC
     */

    document.addEventListener(
        "keydown",
        function(e){

            if(e.key === "Escape")
                closeQr();

        }
    );


    load();

})();


/* =====================================================
   START MUSIC AFTER USER INTERACTION
===================================================== */

document.addEventListener(
    "click",
    function(){

        if(!musicPlaying)
            startMusic();

    },
    {
        once:true
    }
);

</script>
