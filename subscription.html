<script>

/* =====================================================
   LANGUAGE
===================================================== */

let currentLang = "fa";

const translations = {

    fa:{
        subscription:"اشتراک",
        loading:"در حال دریافت اطلاعات اشتراک...",
        remaining:"زمان باقی‌مانده",
        active:"اشتراک فعال",
        inactive:"اشتراک غیرفعال",
        traffic:"ترافیک مصرفی",
        protocol:"پروتکل",
        devices:"تعداد دستگاه",
        configs:"کانفیگ‌های اشتراک",
        copyAll:"کپی همه",
        qr:"QR",
        copySub:"کپی لینک ساب",
        importSub:"وارد کردن اشتراک",
        subscriptionStatus:"وضعیت اشتراک",
        copy:"کپی شد ✓",
        copyError:"خطا در کپی",
        days:"روز",
        errorTitle:"اشتراک پیدا نشد",
        connection:"Connection",
        railway:"Railway IPs",
        cloudflare:"Cloudflare IPs",
        sni:"SNI Spoof for v2box",
        scan:"برای وارد کردن اشتراک اسکن کنید"
    },

    en:{
        subscription:"Subscription",
        loading:"Loading subscription information...",
        remaining:"Remaining Time",
        active:"Active Subscription",
        inactive:"Inactive Subscription",
        traffic:"Traffic Usage",
        protocol:"Protocol",
        devices:"Devices",
        configs:"Subscription Configs",
        copyAll:"Copy All",
        qr:"QR",
        copySub:"Copy Subscription",
        importSub:"Import Subscription",
        subscriptionStatus:"Subscription Status",
        copy:"Copied ✓",
        copyError:"Copy failed",
        days:"Days",
        errorTitle:"Subscription Not Found",
        connection:"Connection",
        railway:"Railway IPs",
        cloudflare:"Cloudflare IPs",
        sni:"SNI Spoof for v2box",
        scan:"Scan to import subscription"
    }

};

function t(key){
    return translations[currentLang][key] || key;
}

function toggleLanguage(){

    currentLang =
        currentLang === "fa"
        ? "en"
        : "fa";

    document.documentElement.lang =
        currentLang;

    document.documentElement.dir =
        currentLang === "fa"
        ? "rtl"
        : "ltr";

    document.getElementById("headerSubtitle").textContent =
        t("subscription");

    if(state.data){
        render(state.data);
    }

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

    document.documentElement.classList.toggle("dark");

    const dark =
        document.documentElement.classList.contains("dark");

    document.getElementById("themeIcon").textContent =
        dark ? "dark_mode" : "light_mode";

}


/* =====================================================
   MOUSE GLOW
===================================================== */

const mouseGlow =
    document.getElementById("mouseGlow");

if(window.matchMedia("(pointer:fine)").matches){

    document.addEventListener(
        "mousemove",
        function(e){

            mouseGlow.style.left =
                e.clientX + "px";

            mouseGlow.style.top =
                e.clientY + "px";

            mouseGlow.classList.add("active");

        }
    );

    document.addEventListener(
        "mouseleave",
        function(){

            mouseGlow.classList.remove("active");

        }
    );

}


/* =====================================================
   MUSIC
===================================================== */

let audioCtx = null;
let masterGain = null;
let musicTimer = null;
let musicPlaying = false;

const notes = [
    220.00,
    261.63,
    329.63,
    392.00,
    329.63,
    293.66
];

let noteIndex = 0;

function startMusic(){

    if(musicPlaying)
        return;

    try{

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioCtx.createGain();

        masterGain.gain.value =
            0.035;

        masterGain.connect(
            audioCtx.destination
        );

        musicPlaying = true;

        document
            .getElementById("musicBtn")
            .classList.add("playing");

        document
            .getElementById("musicIcon")
            .textContent = "music_note";

        playNote();

    }catch(e){

        console.warn(
            "Audio unavailable",
            e
        );

    }

}

function playNote(){

    if(!musicPlaying ||
       !audioCtx ||
       !masterGain)
        return;

    const now =
        audioCtx.currentTime;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.value =
        notes[noteIndex];

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        0.18,
        now + .8
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + 3.8
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 4);

    noteIndex =
        (noteIndex + 1) %
        notes.length;

    musicTimer =
        setTimeout(
            playNote,
            2500
        );

}

function stopMusic(){

    musicPlaying = false;

    clearTimeout(musicTimer);

    if(masterGain && audioCtx){

        try{

            masterGain.gain.cancelScheduledValues(
                audioCtx.currentTime
            );

            masterGain.gain.setValueAtTime(
                masterGain.gain.value,
                audioCtx.currentTime
            );

            masterGain.gain.exponentialRampToValueAtTime(
                .001,
                audioCtx.currentTime + .3
            );

        }catch(e){}

    }

    document
        .getElementById("musicBtn")
        .classList.remove("playing");

    document
        .getElementById("musicIcon")
        .textContent = "music_off";

}

function toggleMusic(){

    if(musicPlaying)
        stopMusic();
    else
        startMusic();

}


/* =====================================================
   API
===================================================== */

(function(){

    var parts =
        window.location.pathname
            .split("/")
            .filter(Boolean);

    var uname =
        decodeURIComponent(
            parts[parts.length - 1] || ""
        );

    /*
     * اگر URL به شکل:
     * /sub/username
     * باشد username درست گرفته می‌شود.
     */

    var apiUrl =
        "/api/sub/" +
        encodeURIComponent(uname);

    var subUrl = "";

    var state = {
        data:null
    };

    window.state = state;


    /* =================================================
       NUMBER
    ================================================= */

    function num(v){

        if(v === null ||
           v === undefined ||
           v === "")
            return 0;

        var n =
            Number(v);

        return isFinite(n)
            ? n
            : 0;

    }


    /* =================================================
       BYTES
    ================================================= */

    function fmtBytes(bytes){

        bytes = num(bytes);

        if(bytes <= 0)
            return "0 B";

        const units = [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

        let i = 0;

        while(
            bytes >= 1024 &&
            i < units.length - 1
        ){

            bytes /= 1024;
            i++;

        }

        let decimals =
            i === 0
            ? 0
            : bytes >= 10
                ? 1
                : 2;

        return bytes.toFixed(decimals)
            + " "
            + units[i];

    }


    /* =================================================
       PERSIAN NUMBER
    ================================================= */

    function persianNumber(value){

        if(currentLang !== "fa")
            return String(value);

        return String(value)
            .replace(
                /\d/g,
                function(d){

                    return "۰۱۲۳۴۵۶۷۸۹"[d];

                }
            );

    }


    /* =================================================
       ESCAPE
    ================================================= */

    function esc(value){

        return String(
            value == null
                ? ""
                : value
        ).replace(
            /[&<>"']/g,
            function(c){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#39;"
                }[c];

            }
        );

    }


    /* =================================================
       TOAST
    ================================================= */

    function toast(message){

        var el =
            document.getElementById("toast");

        if(!el)
            return;

        el.textContent =
            message;

        el.classList.add("show");

        clearTimeout(
            window.__toastTimer
        );

        window.__toastTimer =
            setTimeout(
                function(){

                    el.classList.remove("show");

                },
                2200
            );

    }


    /* =================================================
       COPY
    ================================================= */

    async function copyText(text){

        if(!text)
            return;

        try{

            if(
                navigator.clipboard &&
                window.isSecureContext
            ){

                await navigator.clipboard.writeText(
                    text
                );

            }else{

                var textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.value =
                    text;

                textarea.style.position =
                    "fixed";

                textarea.style.opacity =
                    "0";

                document.body.appendChild(
                    textarea
                );

                textarea.focus();
                textarea.select();

                document.execCommand(
                    "copy"
                );

                textarea.remove();

            }

            toast(t("copy"));

        }catch(e){

            toast(t("copyError"));

        }

    }


    /* =================================================
       DATE / SHAMSI
    ================================================= */

    function gregorianToJalali(
        gy,
        gm,
        gd
    ){

        var g_d_m = [
            0,31,59,90,120,151,
            181,212,243,273,304,334
        ];

        var jy;

        if(gy > 1600){

            jy = 979;

            gy -= 1600;

        }else{

            jy = 0;

            gy -= 621;

        }

        var gy2 =
            gm > 2
            ? gy + 1
            : gy;

        var days =
            365 * gy
            + Math.floor(
                (gy2 + 3) / 4
            )
            - Math.floor(
                (gy2 + 99) / 100
            )
            + Math.floor(
                (gy2 + 399) / 400
            )
            - 80
            + gd
            + g_d_m[gm - 1];

        jy +=
            33 *
            Math.floor(
                days / 12053
            );

        days %= 12053;

        jy +=
            4 *
            Math.floor(
                days / 1461
            );

        days %= 1461;

        if(days > 365){

            jy +=
                Math.floor(
                    (days - 1) / 365
                );

            days =
                (days - 1) % 365;

        }

        var jm =
            days < 186
            ? 1 +
                Math.floor(
                    days / 31
                )
            : 7 +
                Math.floor(
                    (days - 186) / 30
                );

        var jd =
            1 +
            (
                days < 186
                ? days % 31
                : (days - 186) % 30
            );

        return [
            jy,
            jm,
            jd
        ];

    }


    function formatJalaliDate(value){

        if(!value)
            return "—";

        var date =
            new Date(value);

        if(isNaN(date.getTime()))
            return esc(value);

        var j =
            gregorianToJalali(
                date.getFullYear(),
                date.getMonth() + 1,
                date.getDate()
            );

        var result =
            j[0] +
            "/" +
            String(j[1]).padStart(2,"0") +
            "/" +
            String(j[2]).padStart(2,"0");

        return currentLang === "fa"
            ? persianNumber(result)
            : result;

    }


    /* =================================================
       REMAINING DAYS
    ================================================= */

    function getRemainingDays(d){

        if(
            d.expire_days !== null &&
            d.expire_days !== undefined &&
            d.expire_days !== ""
        ){

            return num(
                d.expire_days
            );

        }

        var dateValue =
            d.expire_at ||
            d.expires_at ||
            d.expiry ||
            d.expire_date;

        if(!dateValue)
            return null;

        var expire =
            new Date(dateValue);

        if(isNaN(expire.getTime()))
            return null;

        var diff =
            expire.getTime()
            - Date.now();

        return Math.max(
            0,
            Math.ceil(
                diff /
                86400000
            )
        );

    }


    /* =================================================
       RING
    ================================================= */

    function ring(days,maxDays){

        var r = 54;

        var circumference =
            2 * Math.PI * r;

        var pct;

        if(days === null)
            pct = 1;
        else
            pct =
                maxDays > 0
                ? Math.max(
                    0,
                    Math.min(
                        1,
                        days / maxDays
                    )
                )
                : 0;

        var offset =
            circumference *
            (1 - pct);

        var number =
            days === null
            ? "∞"
            : persianNumber(
                Math.max(
                    0,
                    Math.ceil(days)
                )
            );

        return `

        <div class="relative w-48 h-48 mx-auto flex items-center justify-center">

            <svg
                class="w-full h-full"
                viewBox="0 0 120 120">

                <circle
                    cx="60"
                    cy="60"
                    r="54"
                    fill="transparent"
                    stroke="rgba(255,255,255,.06)"
                    stroke-width="8">
                </circle>

                <circle
                    class="progress-ring"
                    cx="60"
                    cy="60"
                    r="54"
                    fill="transparent"
                    stroke="#ffd21f"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${offset}"
                    style="
                        filter:drop-shadow(
                            0 0 5px
                            rgba(255,210,31,.5)
                        );
                    ">
                </circle>

            </svg>

            <div class="absolute flex flex-col items-center">

                <span class="text-4xl font-extrabold gold-glow">
                    ${number}
                </span>

                <span class="text-[10px] text-zinc-500 uppercase tracking-[.25em]">
                    ${currentLang === "fa" ? "روز" : "DAYS"}
                </span>

            </div>

        </div>

        `;

    }


    /* =================================================
       CONFIG PARSER
    ================================================= */

    function parseConfig(c){

        var result = {
            protocol:"",
            host:"",
            port:"",
            path:"",
            sni:"",
            type:""
        };

        try{

            var raw =
                String(c);

            var url =
                new URL(raw);

            result.protocol =
                url.protocol
                    .replace(":","")
                    .toUpperCase();

            result.host =
                url.hostname || "";

            result.port =
                url.port || "";

            result.path =
                url.pathname || "";

            var params =
                new URLSearchParams(
                    url.search
                );

            result.sni =
                params.get("sni") ||
                params.get("peer") ||
                "";

            result.type =
                params.get("type") ||
                params.get("security") ||
                "";

        }catch(e){

            var protocol =
                String(c)
                    .split("://")[0];

            result.protocol =
                protocol
                ? protocol.toUpperCase()
                : "VLESS";

        }

        return result;

    }


    /* =================================================
       CONFIG DISPLAY
    ================================================= */

    function configDisplay(c){

        var p =
            parseConfig(c);

        var display = "";

        if(p.host)
            display =
                p.host;

        if(p.port)
            display +=
                ":" + p.port;

        if(
            p.path &&
            p.path !== "/"
        ){

            display +=
                " " + p.path;

        }

        if(p.sni){

            display +=
                " • SNI: " +
                p.sni;

        }

        if(!display){

            display =
                String(c)
                    .substring(0,100);

            if(String(c).length > 100)
                display += "...";

        }

        return {
            display:display,
            protocol:
                p.protocol || "VLESS",
            type:
                p.type || ""
        };

    }

    /* =================================================
       STATUS
    ================================================= */

    function buildStatusBlock(d){

        var days =
            getRemainingDays(d);

        var used =
            num(
                d.traffic_used_bytes
            );

        var limit =
            num(
                d.traffic_limit_bytes
            );

        var pct =
            d.traffic_percent != null
            ? num(d.traffic_percent)
            : (
                limit > 0
                ? Math.min(
                    100,
                    used / limit * 100
                )
                : 0
            );

        return `

                                  )
                            }

    /* =================================================
       CONFIG COLLECTION
    ================================================= */

    function collectConfigs(d){

        var result = [];

        function add(value){

            if(!value)
                return;

            if(Array.isArray(value)){

                value.forEach(add);
                return;

            }

            var str =
                String(value).trim();

            if(!str)
                return;

            if(
                str.includes(
                    "%F0%9F%93%8A"
                )
            )
                return;

            if(
                !result.includes(str)
            ){

                result.push(str);

            }

        }

        /*
         * اولویت با worker_configs
         */

        if(
            Array.isArray(d.worker_configs) &&
            d.worker_configs.length
        ){

            add(d.worker_configs);

        }else{

            add(d.configs);

            add(d.config);

            add(d.vless_link);

        }

        return result;

    }


    /* =================================================
       STATUS CONFIG
    ================================================= */

    function makeStatusConfig(
        cfg,
        d,
        days,
        pct
    ){

        if(!cfg)
            return "";

        var base =
            String(cfg)
                .replace(/#[^#]*$/,"");

        var username =
            d.username ||
            uname ||
            "USER";

        var remark =
            username +
            " STATUS | " +
            (
                days === null
                ? "∞"
                : Math.ceil(days)
            ) +
            "d | " +
            Math.round(pct) +
            "%";

        return (
            base +
            "#" +
            encodeURIComponent(
                remark
            )
        );

    }

    /* =================================================

    ================================================= */

    function renderError(message){

        document.getElementById(
            "app"
        ).innerHTML = `

            <div class="w-16 h-16 rounded-2xl mx-auto bg-red-500/5 flex items-center justify-center">

    /* =================================================
       LOAD
    ================================================= */

    async function load(){

        if(!uname){

            renderError(
                "Invalid subscription username"
            );

            return;

        }

        try{

            var response =
                await fetch(
                    apiUrl,
                    {
                        method:"GET",
                        headers:{
                            "Accept":
                                "application/json"
                        },
                        cache:"no-store"
                    }
                );

            if(!response.ok){

                if(response.status === 404){

                    throw new Error(
                        "User not found"
                    );

                }

                throw new Error(
                    "Server error: " +
                    response.status
                );

            }

            var data =
                await response.json();

            if(
                !data ||
                typeof data !== "object"
            ){

                throw new Error(
                    "Invalid API response"
                );

            }

            state.data =
                data;

            document.title =
                "SEP NET | " +
                (
                    data.username ||
                    uname
                );

            render(data);

        }catch(error){

            console.error(
                "Subscription API error:",
                error
            );

            renderError(
                error.message ||
                "Unable to load subscription"
            );

        }

    }


    /* =================================================
       ALL CONFIGS
    ================================================= */

    function allConfigsText(){

        var parts = [];

        if(window.__statuscfg){

            parts.push(
                window.__statuscfg
            );

        }

        (window.__cfgs || [])
            .forEach(
                function(c){

                    if(c)
                        parts.push(c);

                }
            );

        return parts.join("\n");

    }


    /* =================================================
       GLOBAL ACTIONS
    ================================================= */

    window.copyCfg =
        function(){

            var text =
                allConfigsText();

            if(text)
                copyText(text);

        };


    window.copyCfgIndex =
        function(index){

            var c =
                (window.__cfgs || [])[index];

            if(c)
                copyText(c);

        };


    window.copyStatus =
        function(){

            if(window.__statuscfg)
                copyText(
                    window.__statuscfg
                );

        };


    window.copySub =
        function(){

            if(subUrl)
                copyText(subUrl);

        };


    window.importSub =
        function(){

            if(!subUrl){

                toast(
                    currentLang === "fa"
                    ? "لینک اشتراک موجود نیست"
                    : "Subscription URL unavailable"
                );

                return;

            }

            /*
             * V2RayNG
             */

            var v2rayng =
                "v2rayng://install-sub?url=" +
                encodeURIComponent(
                    subUrl
                );

            /*
             * در موبایل/کلاینت مناسب
             * این لینک را باز می‌کنیم.
             */

            window.location.href =
                v2rayng;

        };


    window.showQr =
        function(){

            var modal =
                document.getElementById(
                    "qrModal"
                );

            var img =
                document.getElementById(
                    "qrImg"
                );

            if(!modal || !img)
                return;


            /*
             * اول اگر API QR وجود داشته باشد
             * از همان استفاده می‌کنیم.
             */

            if(uname){

                img.src =
                    "/api/sub/" +
                    encodeURIComponent(
                        uname
                    ) +
                    "/qr?t=" +
                    Date.now();

                img.onerror =
                    function(){

                        /*
                         * fallback عمومی
                         */

                        if(subUrl){

                            img.onerror = null;

                            img.src =
                                "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
                                encodeURIComponent(
                                    subUrl
                                );

                        }

                    };

            }else if(subUrl){

                img.src =
                    "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
                    encodeURIComponent(
                        subUrl
                    );

            }

            modal.classList.add(
                "show"
            );

        };


    window.closeQr =
        function(){

            document
                .getElementById(
                    "qrModal"
                )
                .classList.remove(
                    "show"
                );

        };


    /* =================================================
       QR CLOSE
    ================================================= */

    document
        .getElementById("qrModal")
        .addEventListener(
            "click",
            function(e){

                if(
                    e.target ===
                    this
                ){

                    closeQr();

                }

            }
        );


    /* =================================================
       ESC CLOSE
    ================================================= */

    document.addEventListener(
        "keydown",
        function(e){

            if(e.key === "Escape"){

                closeQr();

            }

        }
    );


    /* =================================================
       START
    ================================================= */

    load();

})();

</script>

</body>
</html>
