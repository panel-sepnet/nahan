<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{
    background:#050505;
    color:#f5f5f5;
    font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
}

/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    z-index:-10;
    background:
        radial-gradient(
            ellipse 800px 600px at 15% 10%,
            rgba(255,210,31,.12),
            transparent 70%
        ),
        radial-gradient(
            ellipse 700px 500px at 90% 20%,
            rgba(255,184,0,.08),
            transparent 65%
        ),
        radial-gradient(
            ellipse 600px 500px at 50% 100%,
            rgba(255,210,31,.05),
            transparent 70%
        ),
        #050505;
}

.grid-bg{
    position:fixed;
    inset:0;
    z-index:-9;
    opacity:.25;
    background-image:
        linear-gradient(rgba(255,210,31,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,210,31,.035) 1px,transparent 1px);
    background-size:50px 50px;
    mask-image:radial-gradient(
        ellipse 90% 80% at center,
        black 20%,
        transparent 85%
    );
    animation:gridMove 35s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:50px 50px;
    }
}

/* =========================
   ORBS
========================= */

.orb{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(90px);
    z-index:-8;
    animation:floatOrb 18s ease-in-out infinite alternate;
}

.orb1{
    width:420px;
    height:420px;
    top:-170px;
    right:-100px;
    background:#ffd21f;
    opacity:.08;
}

.orb2{
    width:350px;
    height:350px;
    bottom:-150px;
    left:-100px;
    background:#ffb800;
    opacity:.07;
    animation-delay:-5s;
}

.orb3{
    width:260px;
    height:260px;
    top:45%;
    left:50%;
    background:#fff06a;
    opacity:.035;
    animation-delay:-9s;
}

@keyframes floatOrb{
    from{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(35px,-30px) scale(1.12);
    }
    to{
        transform:translate(-25px,35px) scale(1.05);
    }
}

/* =========================
   MOUSE GLOW
========================= */

.mouse-glow{
    position:fixed;
    width:400px;
    height:400px;
    margin:-200px 0 0 -200px;
    border-radius:50%;
    pointer-events:none;
    z-index:-7;
    background:radial-gradient(
        circle,
        rgba(255,210,31,.13),
        rgba(255,184,0,.05) 35%,
        transparent 70%
    );
    filter:blur(15px);
    opacity:0;
    transition:opacity .3s ease;
}

.mouse-glow.active{
    opacity:1;
}

/* =========================
   GLASS
========================= */

.glass{
    background:rgba(10,10,10,.72);
    border:1px solid rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 15px 50px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.025);
    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        border-color .35s ease,
        box-shadow .35s ease;
}

.glass:hover{
    transform:translateY(-3px);
    border-color:rgba(255,210,31,.22);
    box-shadow:
        0 20px 60px rgba(0,0,0,.7),
        0 0 30px rgba(255,210,31,.045);
}

/* =========================
   GOLD
========================= */

.gold{
    color:#ffd21f;
}

.gold-glow{
    color:#ffd21f;
    text-shadow:
        0 0 7px rgba(255,210,31,.5),
        0 0 18px rgba(255,184,0,.25);
}

.gold-border{
    border-color:rgba(255,210,31,.3);
    box-shadow:
        0 0 15px rgba(255,210,31,.08),
        inset 0 0 10px rgba(255,210,31,.025);
}

.gold-button{
    background:linear-gradient(
        110deg,
        #ffb800,
        #ffd21f,
        #fff06a,
        #ffd21f,
        #ffb800
    );
    background-size:250% 100%;
    color:#080808;
    animation:buttonShimmer 4s linear infinite;
    font-weight:800;
}

@keyframes buttonShimmer{
    0%{
        background-position:-200% 0;
    }
    100%{
        background-position:200% 0;
    }
}

/* =========================
   RING
========================= */

.progress-ring{
    transform:rotate(-90deg);
    transform-origin:50% 50%;
    transition:stroke-dashoffset .6s ease;
}

/* =========================
   STATUS
========================= */

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ffd21f;
    box-shadow:
        0 0 8px #ffd21f,
        0 0 20px rgba(255,210,31,.55);
    animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        box-shadow:
            0 0 7px #ffd21f,
            0 0 15px rgba(255,210,31,.4);
    }
    50%{
        box-shadow:
            0 0 12px #ffd21f,
            0 0 28px rgba(255,210,31,.65);
    }
}

/* =========================
   ANIMATION
========================= */

.rise{
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
}

.rise1{animation-delay:.08s}
.rise2{animation-delay:.16s}
.rise3{animation-delay:.24s}
.rise4{animation-delay:.32s}

@keyframes rise{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-track{
    background:rgba(255,255,255,.025);
}

::-webkit-scrollbar-thumb{
    background:rgba(255,210,31,.25);
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:rgba(255,210,31,.45);
}

/* =========================
   CONFIG
========================= */

.cfg{
    border:1px solid rgba(255,255,255,.055);
    background:rgba(255,255,255,.025);
    border-radius:16px;
    padding:15px;
    cursor:pointer;
    transition:.3s ease;
}

.cfg:hover{
    border-color:rgba(255,210,31,.2);
    background:rgba(255,210,31,.035);
    transform:translateX(-2px);
}

.cfg-text{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:#999;
}

/* =========================
   MUSIC BUTTON
========================= */

.music-btn{
    position:fixed;
    left:20px;
    bottom:20px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(255,210,31,.3);
    background:rgba(10,10,10,.8);
    backdrop-filter:blur(12px);
    color:#ffd21f;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:100;
    box-shadow:0 0 20px rgba(255,210,31,.08);
    transition:.3s ease;
}

.music-btn:hover{
    transform:scale(1.08);
    border-color:#ffd21f;
    box-shadow:0 0 25px rgba(255,210,31,.2);
}

.music-btn.playing{
    animation:musicPulse 2s ease-in-out infinite;
}

@keyframes musicPulse{
    0%,100%{
        box-shadow:0 0 10px rgba(255,210,31,.15);
    }
    50%{
        box-shadow:0 0 25px rgba(255,210,31,.35);
    }
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    background:#ffd21f;
    color:#080808;
    padding:10px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:13px;
    transition:.3s ease;
    z-index:200;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   QR
========================= */

#qrModal{
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
}

#qrModal.show{
    opacity:1;
    pointer-events:auto;
}

@media(max-width:768px){

    .glass{
        border-radius:22px;
    }

    .mouse-glow{
        display:none;
    }

}

</style>
</head>

<script>

/* =====================================================
   LANGUAGE
===================================================== */

function toggleLanguage(){

    const html = document.documentElement;

    if(html.lang === "fa"){

        html.lang = "en";
        html.dir = "ltr";

    }else{

        html.lang = "fa";
        html.dir = "rtl";

    }

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode(){

    document.documentElement.classList.toggle("dark");

}


/* =====================================================
   MOUSE GLOW
===================================================== */

const mouseGlow = document.getElementById("mouseGlow");

if(window.matchMedia("(pointer:fine)").matches){

    document.addEventListener("mousemove",function(e){

        mouseGlow.style.left = e.clientX + "px";
        mouseGlow.style.top = e.clientY + "px";

        mouseGlow.classList.add("active");

    });

    document.addEventListener("mouseleave",function(){

        mouseGlow.classList.remove("active");

    });

}


/* =====================================================
   MUSIC ENGINE
   آرام و بدون نیاز به فایل خارجی
===================================================== */

let audioCtx = null;
let masterGain = null;
let musicTimer = null;
let musicPlaying = false;

const notes = [
    220.00,
    261.63,
    329.63,
    392.00,
    329.63,
    293.66
];

let noteIndex = 0;


function startMusic(){

    if(musicPlaying)
        return;

    audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    masterGain = audioCtx.createGain();

    masterGain.gain.value = 0.035;

    masterGain.connect(audioCtx.destination);

    musicPlaying = true;

    document.getElementById("musicBtn")
        .classList.add("playing");

    document.getElementById("musicIcon")
        .textContent = "music_note";

    playNote();

}


function playNote(){

    if(!musicPlaying)
        return;

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "sine";

    osc.frequency.value = notes[noteIndex];

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        0.18,
        now + 0.8
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 3.8
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 4);

    noteIndex++;

    if(noteIndex >= notes.length)
        noteIndex = 0;

    musicTimer = setTimeout(
        playNote,
        2500
    );

}


function stopMusic(){

    musicPlaying = false;

    clearTimeout(musicTimer);

    if(masterGain){

        masterGain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.5
        );

    }

    document.getElementById("musicBtn")
        .classList.remove("playing");

    document.getElementById("musicIcon")
        .textContent = "music_off";

}


function toggleMusic(){

    if(musicPlaying){

        stopMusic();

    }else{

        startMusic();

    }

}


/* Start music after first interaction */

document.addEventListener(
    "click",
    function(){

        if(!musicPlaying)
            startMusic();

    },
    {once:true}
);


/* =====================================================
   API
===================================================== */

(function(){

    var uname =
        window.location.pathname
        .split("/")
        .filter(Boolean)
        .pop();

    var apiUrl =
        "/api/sub/" +
        encodeURIComponent(uname);

    var subUrl = "";

    var state = {
        data:null
    };


    /* =========================
       FORMAT BYTES
    ========================= */

    function fmtBytes(b){

        if(!b || b < 1)
            return "0 B";

        var units = [
            "B",
            "KB",
            "MB",
            "GB",
            "TB"
        ];

        var i = 0;

        while(
            b >= 1024 &&
            i < units.length - 1
        ){

            b /= 1024;
            i++;

        }

        return b.toFixed(i ? 2 : 0)
            + " "
            + units[i];

    }


    /* =========================
       ESCAPE
    ========================= */

    function esc(s){

        return String(
            s == null ? "" : s
        ).replace(
            /[&<>"']/g,
            function(c){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#39;"
                }[c];

            }
        );

    }


    /* =========================
       TOAST
    ========================= */

    function toast(msg){

        var t =
            document.getElementById("toast");

        t.textContent = msg;

        t.classList.add("show");

        setTimeout(function(){

            t.classList.remove("show");

        },2200);

    }


    /* =========================
       COPY
    ========================= */

    function copyText(txt){

        if(!txt)
            return;

        if(navigator.clipboard){

            navigator.clipboard
                .writeText(txt)
                .then(function(){

                    toast("کپی شد ✓");

                })
                .catch(function(){

                    toast("خطا در کپی");

                });

        }else{

            var ta =
                document.createElement("textarea");

            ta.value = txt;

            document.body.appendChild(ta);

            ta.select();

            document.execCommand("copy");

            document.body.removeChild(ta);

            toast("کپی شد ✓");

        }

    }


    /* =========================
       RING
    ========================= */

    function ring(days,maxDays){

        var r = 54;

        var c =
            2 * Math.PI * r;

        var pct =
            maxDays > 0
            ? Math.min(1,days / maxDays)
            : 1;

        var off =
            c * (1-pct);

        var num =
            days === null ||
            days === undefined
            ? "∞"
            : String(days);

        return `

        <div class="relative w-48 h-48 mx-auto flex items-center justify-center">

            <svg
                class="w-full h-full"
                viewBox="0 0 120 120">

                <circle
                    cx="60"
                    cy="60"
                    r="54"
                    fill="transparent"
                    stroke="rgba(255,255,255,.06)"
                    stroke-width="8">
                </circle>

                <circle
                    class="progress-ring"
                    cx="60"
                    cy="60"
                    r="54"
                    fill="transparent"
                    stroke="#ffd21f"
                    stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="${c}"
                    stroke-dashoffset="${off}"
                    style="
                        filter:
                        drop-shadow(
                            0 0 5px
                            rgba(255,210,31,.5)
                        );
                    ">
                </circle>

            </svg>

            <div class="absolute flex flex-col items-center">

                <span class="text-4xl font-extrabold gold-glow">
                    ${num}
                </span>

                <span class="text-[10px] text-zinc-500 uppercase tracking-[.25em]">
                    DAYS
                </span>

            </div>

        </div>

        `;

    }


    /* =========================
       CONFIG BLOCK
    ========================= */

    function cfgBlock(c,i,dd){

        var address = "";
        var port = "";
        var path = "";
        var sni = "";
        var type = "";

        try{

            var url = new URL(c);

            address = url.hostname;
            port = url.port;
            path = url.pathname;

            var params =
                new URLSearchParams(url.search);

            sni =
                params.get("sni") || "";

            type =
                params.get("type") || "ws";

        }catch(e){}


        var display = "";

        if(address && port)
            display =
                address + ":" + port;

        if(path && path !== "/")
            display += " " + path;

        if(sni)
            display += " | SNI: " + sni;

        if(!display)
            display =
                c.substring(0,80) + "...";


        return `

        <div
            class="cfg group"
            onclick="copyCfgIndex(${i})">

            <div class="flex items-center justify-between gap-4">

                <div class="min-w-0">

                    <div class="flex flex-wrap items-center gap-2 mb-2">

                        <span
                            class="font-mono text-xs font-bold gold"
                            dir="ltr">

                            ${(c.split("://")[0] || dd.protocol || "vless").toUpperCase()}
                            #${i+1}

                        </span>

                        <span class="px-2 py-1 rounded-full bg-[#ffd21f]/5 border border-[#ffd21f]/10 text-[9px] text-zinc-500">

                            ${esc(type.toUpperCase())}

                        </span>

                    </div>

                    <div
                        class="cfg-text truncate max-w-[250px] md:max-w-[600px]"
                        dir="ltr"
                        title="${esc(c)}">

                        ${esc(display)}

                    </div>

                </div>

                <button
                    onclick="event.stopPropagation();copyCfgIndex(${i})"
                    class="w-9 h-9 shrink-0 rounded-xl bg-white/5 hover:bg-[#ffd21f]/10 hover:text-[#ffd21f] flex items-center justify-center text-zinc-500 transition">

                    <span class="material-symbols-outlined text-[17px]">
                        content_copy
                    </span>

                </button>

            </div>

        </div>

        `;

    }


    /* =========================
       CONFIG SECTION
    ========================= */

    function cfgSection(label,count){

        return `

        <div class="flex items-center gap-2 px-3 py-2 my-1">

            <span class="material-symbols-outlined gold text-[16px]">
                bolt
            </span>

            <span class="text-[10px] text-zinc-500 font-bold">
                ${label}
                ${count ? " — " + count : ""}
            </span>

        </div>

        `;

    }


    /* =========================
       STATUS
    ========================= */

    function buildStatusBlock(){

        var d = state.data || {};

        var days =
            d.expire_days == null
            ? "∞"
            : d.expire_days;

        var used =
            d.traffic_used_bytes || 0;

        var limit =
            d.traffic_limit_bytes || 0;

        var pct =
            d.traffic_percent != null
            ? d.traffic_percent
            : (
                limit > 0
                ? Math.min(
                    100,
                    used / limit * 100
                )
                : 0
            );

        return `

        <div
            class="cfg"
            onclick="copyStatus()">

            <div class="flex items-center gap-3">

                <div class="w-9 h-9 rounded-xl bg-[#ffd21f]/10 flex items-center justify-center">

                    <span class="material-symbols-outlined gold text-[19px]">
                        schedule
                    </span>

                </div>

                <div class="flex-1">

                    <div class="text-xs font-bold">
                        وضعیت اشتراک
                    </div>

                    <div class="flex flex-wrap gap-2 mt-2">

                        <span class="px-2 py-1 rounded-full bg-white/5 text-[9px] text-zinc-500">

                            ${days} روز

                        </span>

                        <span class="px-2 py-1 rounded-full bg-white/5 text-[9px] text-zinc-500">

                            ${fmtBytes(used)}
                            /
                            ${limit > 0 ? fmtBytes(limit) : "∞"}

                        </span>

                        <span class="px-2 py-1 rounded-full bg-[#ffd21f]/10 text-[#ffd21f] text-[9px]">

                            ${Number(pct).toFixed(1)}%

                        </span>

                    </div>

                </div>

            </div>

        </div>

        `;

    }


    /* =========================
       RENDER
    ========================= */

    function render(d){

        var used =
            d.traffic_used_bytes || 0;

        var limit =
            d.traffic_limit_bytes || 0;

        var pct =
            limit > 0
            ? Math.min(
                100,
                used / limit * 100
            )
            : 0;

        var days =
            d.expire_days == null
            ? null
            : d.expire_days;

        var active =
            d.is_active !== false &&
            d.status === "active";

        var cfg =
            d.config ||
            d.vless_link ||
            "";

        var cfgs =
            Array.isArray(d.configs) &&
            d.configs.length
            ? d.configs.filter(function(c){

                return c &&
                    c.indexOf("%F0%9F%93%8A") === -1;

            })
            : (cfg ? [cfg] : []);

        if(
            Array.isArray(d.worker_configs) &&
            d.worker_configs.length
        ){

            cfgs =
                d.worker_configs.slice();

        }

        window.__cfgs = cfgs;

        window.__cfg = cfg;

        var customRailway =
            Array.isArray(d.custom_railway_configs)
            ? d.custom_railway_configs
            : [];

        var customCf =
            Array.isArray(d.custom_cf_configs)
            ? d.custom_cf_configs
            : [];

        var sniSpoof =
            Array.isArray(d.sni_spoof_configs)
            ? d.sni_spoof_configs
            : [];

        var statusCfg = "";

        if(cfg){

            var statusRemark =
                (d.username || uname) +
                " STATUS | " +
                (days == null ? "∞" : days) +
                "d | " +
                Math.round(pct) +
                "%";

            statusCfg =
                cfg.replace(/#[^#]*$/,"") +
                "#" +
                encodeURIComponent(statusRemark);

        }

        window.__statuscfg = statusCfg;

        subUrl =
            d.config_uuid
            ? window.location.origin +
              "/sub/" +
              d.config_uuid
            : "";

        /* LEFT */

        var left = `

        <div class="flex flex-col gap-5">

            <div class="glass rounded-3xl p-7 md:p-9 text-center rise rise1 relative overflow-hidden">

                <div
                    class="absolute inset-0 pointer-events-none"
                    style="
                        background:
                        radial-gradient(
                            circle at center,
                            rgba(255,210,31,.08),
                            transparent 60%
                        );
                    ">
                </div>

                <div class="relative">

                    <div class="flex justify-center mb-2">

                        <span class="text-[10px] tracking-[.25em] text-zinc-600 uppercase">
                            SEP NET
                        </span>

                    </div>

                    <h2 class="text-xl font-bold mb-6">
                        زمان <span class="gold">باقیمانده</span>
                    </h2>

                    ${ring(days,30)}

                    <div class="mt-5 flex justify-center items-center gap-2">

                        <div class="status-dot"></div>

                        <span class="text-xs text-zinc-500">
                            ${active ? "اشتراک فعال" : "اشتراک غیرفعال"}
                        </span>

                    </div>

                </div>

            </div>


            <div class="glass rounded-3xl p-6 rise rise2">

                <div class="flex justify-between items-end mb-3">

                    <span class="text-xs text-zinc-500">
                        ترافیک مصرفی
                    </span>

                    <div dir="ltr">

                        <span class="text-lg font-bold">
                            ${fmtBytes(used)}
                        </span>

                        <span class="text-xs text-zinc-600">
                            /
                            ${limit > 0 ? fmtBytes(limit) : "∞"}
                        </span>

                    </div>

                </div>

                <div class="h-2 rounded-full bg-white/5 overflow-hidden">

                    <div
                        class="h-full rounded-full"
                        style="
                            width:${pct.toFixed(1)}%;
                            background:
                            linear-gradient(
                                90deg,
                                #ffb800,
                                #ffd21f,
                                #fff06a
                            );
                            box-shadow:
                            0 0 10px
                            rgba(255,210,31,.35);
                        ">
                    </div>

                </div>

                <div class="flex justify-between mt-5 pt-5 border-t border-white/5">

                    <span class="text-xs text-zinc-500">
                        پروتکل
                    </span>

                    <span
                        class="font-mono text-xs gold"
                        dir="ltr">

                        ${(d.protocol || "VLESS").toUpperCase()}

                    </span>

                </div>

                <div class="flex justify-between mt-5 pt-5 border-t border-white/5">

                    <span class="text-xs text-zinc-500">
                        تعداد دستگاه
                    </span>

                    <span
                        class="font-mono text-xs"
                        dir="ltr">

                        ${
                            d.used_ips != null
                            ? d.used_ips +
                              " / " +
                              (
                                d.max_ip_per_user != null
                                ? d.max_ip_per_user
                                : "∞"
                              )
                            : "∞"
                        }

                    </span>

                </div>

            </div>

        </div>

        `;


        /* RIGHT */

        var configHtml = "";

        configHtml += buildStatusBlock();

        var index = 0;

        cfgs.forEach(function(c){

            configHtml +=
                cfgBlock(c,index,d);

            index++;

        });


        if(customRailway.length){

            configHtml +=
                cfgSection(
                    "Railway IPs",
                    customRailway.length
                );

            customRailway.forEach(function(){

                if(cfgs[index]){

                    configHtml +=
                        cfgBlock(
                            cfgs[index],
                            index,
                            d
                        );

                    index++;

                }

            });

        }


        if(customCf.length){

            configHtml +=
                cfgSection(
                    "Cloudflare IPs",
                    customCf.length
                );

            customCf.forEach(function(){

                if(cfgs[index]){

                    configHtml +=
                        cfgBlock(
                            cfgs[index],
                            index,
                            d
                        );

                    index++;

                }

            });

        }


        if(sniSpoof.length){

            configHtml +=
                cfgSection(
                    "SNI Spoof for v2box",
                    sniSpoof.length
                );

            sniSpoof.forEach(function(){

                if(cfgs[index]){

                    configHtml +=
                        cfgBlock(
                            cfgs[index],
                            index,
                            d
                        );

                    index++;

                }

            });

        }


        var right = `

        <div class="glass rounded-3xl p-6 md:p-8 h-full rise rise3">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">

                <div>

                    <div class="text-[10px] text-zinc-600 tracking-[.2em] uppercase mb-1">
                        Connection
                    </div>

                    <h2 class="text-xl font-bold">
                        کانفیگ‌های <span class="gold">اشتراک</span>
                    </h2>

                </div>

                <div class="flex gap-2">

                    ${
                        cfg
                        ? `
                        <button
                            onclick="showQr()"
                            class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-white/10 hover:border-[#ffd21f]/30 hover:text-[#ffd21f] text-xs text-zinc-400 transition">

                            <span class="material-symbols-outlined text-[17px]">
                                qr_code_2
                            </span>

                            QR
                        </button>
                        `
                        : ""
                    }

                    ${
                        cfg
                        ? `
                        <button
                            onclick="copyCfg()"
                            class="flex items-center gap-2 px-4 py-2.5 rounded-xl gold-button text-xs">

                            <span class="material-symbols-outlined text-[17px]">
                                content_copy
                            </span>

                            کپی همه
                        </button>
                        `
                        : ""
                    }

                </div>

            </div>


            <div class="flex flex-col gap-3 max-h-[650px] overflow-y-auto pr-1">

                ${configHtml}

            </div>


            ${
                cfg
                ? `
                <div class="flex flex-wrap gap-2 mt-5 pt-5 border-t border-white/5">

                    <button
                        onclick="copySub()"
                        class="flex-1 min-w-[160px] flex items-center justify-center gap-2 px-4 py-3 rounded-xl border border-white/10 hover:border-[#ffd21f]/30 hover:text-[#ffd21f] text-xs text-zinc-400 transition">

                        <span class="material-symbols-outlined text-[17px]">
                            link
                        </span>

                        کپی لینک ساب

                    </button>


                    <button
                        onclick="importSub()"
                        class="flex-1 min-w-[160px] flex items-center justify-center gap-2 px-4 py-3 rounded-xl gold-button text-xs">

                        <span class="material-symbols-outlined text-[17px]">
                            download
                        </span>

                        وارد کردن اشتراک

                    </button>

                </div>
                `
                : ""
            }

        </div>

        `;


        document.getElementById("app").innerHTML = `

        <div class="grid grid-cols-1 md:grid-cols-12 gap-5">

            <div class="md:col-span-4">
                ${left}
            </div>

            <div class="md:col-span-8">
                ${right}
            </div>

        </div>

        `;

    }


    /* =========================
       ERROR
    ========================= */

    function renderError(msg){

        document.getElementById("app").innerHTML = `

        <div class="glass rounded-3xl p-12 text-center">

            <div class="w-16 h-16 rounded-2xl mx-auto bg-red-500/5 flex items-center justify-center">

                <span class="material-symbols-outlined text-red-400 text-[35px]">
                    error
                </span>

            </div>

            <h2 class="mt-5 text-xl font-bold">
                اشتراک پیدا نشد
            </h2>

            <p class="mt-2 text-sm text-zinc-600">
                ${esc(msg)}
            </p>

        </div>

        `;

    }


    /* =========================
       LOAD
    ========================= */

    async function load(){

        try{

            var r =
                await fetch(apiUrl);

            if(!r.ok){

                if(r.status === 404)
                    throw new Error(
                        "User not found"
                    );

                throw new Error(
                    "Server error"
                );

            }

            var d =
                await r.json();

            state.data = d;

            document.title =
                "SEP NET | " +
                (d.username || uname);

            render(d);

        }catch(e){

            renderError(e.message);

        }

    }


    /* =========================
       ALL CONFIGS
    ========================= */

    function allConfigsText(){

        var parts = [];

        if(window.__statuscfg)
            parts.push(
                window.__statuscfg
            );

        (window.__cfgs || [])
            .forEach(function(c){

                if(c)
                    parts.push(c);

            });

        return parts.join("\n");

    }


    /* =========================
       GLOBAL ACTIONS
    ========================= */

    window.copyCfg = function(){

        copyText(
            allConfigsText()
        );

    };


    window.copyCfgIndex = function(i){

        var c =
            (window.__cfgs || [])[i];

        if(c)
            copyText(c);

    };


    window.copyStatus = function(){

        if(window.__statuscfg)
            copyText(
                window.__statuscfg
            );

    };


    window.copySub = function(){

        if(subUrl)
            copyText(subUrl);

    };


    window.importSub = function(){

        if(!subUrl)
            return;

        window.open(
            "v2rayng://install-sub?url=" +
            encodeURIComponent(subUrl),
            "_blank"
        );

    };


    window.showQr = function(){

        var modal =
            document.getElementById(
                "qrModal"
            );

        var img =
            document.getElementById(
                "qrImg"
            );

        if(!modal || !img)
            return;

        img.src =
            "/api/sub/" +
            encodeURIComponent(uname) +
            "/qr?t=" +
            Date.now();

        modal.classList.add("show");

    };


    window.closeQr = function(){

        document
            .getElementById("qrModal")
            .classList.remove("show");

    };


    load();

})();

</script>

</body>
</html>
